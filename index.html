<script>
"use strict";
/* ============================================================
   いろどりパレット — 配色パレット自動生成
   リライト不要設計: 色彩理論(色相環・明度・コントラスト計算)と
   和の伝統色は不変の知識のみで構成。変わりうる情報は持たない。
   ============================================================ */

/* ---------- 色変換ユーティリティ ---------- */
function hexToRgb(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if(!m) return null;
  const n=parseInt(m[1],16);
  return [n>>16&255, n>>8&255, n&255];
}
function rgbToHex(r,g,b){
  return "#"+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function rgbToHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  const l=(max+min)/2;
  const s=d===0?0:d/(1-Math.abs(2*l-1));
  return [h, s*100, l*100];
}
function hslToHex(h,s,l){
  h=((h%360)+360)%360; s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return rgbToHex((r+m)*255,(g+m)*255,(b+m)*255);
}
function hexToHsl(hex){ const rgb=hexToRgb(hex); return rgb?rgbToHsl(...rgb):null; }
function relLum(hex){
  const [r,g,b]=hexToRgb(hex).map(v=>{
    v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*r+0.7152*g+0.0722*b;
}
function contrast(hex1,hex2){
  const l1=relLum(hex1), l2=relLum(hex2);
  return (Math.max(l1,l2)+0.05)/(Math.min(l1,l2)+0.05);
}
function textOn(hex){ return contrast(hex,"#FFFFFF")>=contrast(hex,"#000000") ? "#FFFFFF" : "#000000"; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

/* ---------- 配色生成(色彩理論ベース・決定的) ---------- */
const MODES=[
  {id:"omakase", label:"おまかせ", desc:"ベース色を軸に、背景・メイン・アクセントまで揃うバランス型"},
  {id:"analog",  label:"類似色",   desc:"色相環の隣どうし。まとまりが出て失敗しにくい"},
  {id:"comp",    label:"補色",     desc:"正反対の色を差し色に。メリハリが出る"},
  {id:"triad",   label:"トライアド", desc:"色相環を3等分。にぎやかでポップな印象"},
  {id:"mono",    label:"濃淡",     desc:"1色の明るさ違い。上品で統一感のある印象"},
  {id:"pastel",  label:"パステル", desc:"やわらかい淡色5色。かわいい系・ふんわり系に"},
  {id:"dull",    label:"くすみ",   desc:"彩度を抑えたニュアンスカラー。大人っぽい印象"}
];
function makePalette(baseHex, mode){
  const [h,s0,l0]=hexToHsl(baseHex);
  const s=clamp(s0, 8, 92);
  switch(mode){
    case "analog":{
      const ss=clamp(s,35,70);
      return [ [h-30,ss,82],[h-15,ss,68],[h,clamp(s,40,80),54],[h+15,ss,44],[h+30,ss,32] ].map(a=>hslToHex(...a));
    }
    case "comp":{
      return [ [h,clamp(s*.5,15,40),88],[h,s,66],[h,clamp(s,45,85),48],[h+180,clamp(s,45,80),58],[h+180,clamp(s*.7,25,60),80] ].map(a=>hslToHex(...a));
    }
    case "triad":{
      return [ [h,clamp(s*.55,18,45),84],[h,clamp(s,45,80),52],[h+120,clamp(s,40,75),56],[h+240,clamp(s,40,75),56],[h,clamp(s,40,70),30] ].map(a=>hslToHex(...a));
    }
    case "mono":{
      return [90,72,55,40,26].map(l=>hslToHex(h,s,l));
    }
    case "pastel":{
      return [0,1,2,3,4].map(i=>hslToHex(h+i*68, clamp(s,40,60), 85));
    }
    case "dull":{
      const ds=clamp(s*.35,14,28);
      return [ [h-25,ds,80],[h-10,ds,64],[h,ds,50],[h+12,ds,38],[h+25,ds,28] ].map(a=>hslToHex(...a));
    }
    default:{ /* omakase */
      return [ [h,clamp(s*.45,15,40),90],[h+14,clamp(s,40,70),70],[h,clamp(s,45,85),52],[h+150,clamp(s,40,75),58],[h,clamp(s*.8,25,60),24] ].map(a=>hslToHex(...a));
    }
  }
}
function randomBase(){
  const h=Math.floor(Math.random()*360);
  const s=45+Math.floor(Math.random()*40);
  const l=40+Math.floor(Math.random()*30);
  return hslToHex(h,s,l);
}

const PRESETS=[

/* ---------- 状態 ---------- */
const $=s=>document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const LS_KEY="irodori-v1";
function loadFavs(){
  try{ const d=JSON.parse(localStorage.getItem(LS_KEY)); return Array.isArray(d?.favs)?d.favs:[]; }
  catch(e){ return []; }
}
function saveFavs(favs){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({favs})); }catch(e){}
}
let state={
  base:"#7B5EA7",
  mode:"omakase",
  colors:null,          // 現在表示中の5色
  bookSeg:"mood"        // 見本帳のサブタブ
};
/* 共有リンク(#c=RRGGBB,...)から復元 */
(function initFromHash(){
  const m=/[#&]c=([0-9a-fA-F,]+)/.exec(location.hash);
  if(!m) return;
  const cols=m[1].split(",").filter(x=>/^[0-9a-fA-F]{6}$/.test(x)).map(x=>"#"+x.toUpperCase());
  if(cols.length===5){ state.colors=cols; state.base=cols[2]; }
})();
if(!state.colors) state.colors=makePalette(state.base, state.mode);

let toastTimer=null;
function toast(msg){
  const t=$("#toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"), 1600);
}
function copyText(text, msg){
  const done=()=>toast(msg||"コピーしました");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{ fallbackCopy(text); done(); });
  }else{ fallbackCopy(text); done(); }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="absolute"; ta.style.left="-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  ta.remove();
}

/* ---------- 役割の自動割り当て(プレビュー用) ---------- */
function assignRoles(colors){
  const byLum=[...colors].sort((a,b)=>relLum(b)-relLum(a));
  const bg=byLum[0], ink=byLum[byLum.length-1];
  const mids=byLum.slice(1,-1);
  const bySat=[...mids].sort((a,b)=>hexToHsl(b)[1]-hexToHsl(a)[1]);
  const main=bySat[0]||colors[2];
  const accent=bySat[1]||colors[3];
  const sub=bySat[2]||colors[1];
  return {bg, ink, main, accent, sub};
}

/* ---------- つくるタブ ---------- */
function renderMake(){
  const el=$("#tab-make");
  const cols=state.colors;
  const modeObj=MODES.find(m=>m.id===state.mode);
  const r=assignRoles(cols);
  const ratio=contrast(r.ink, r.bg);
  const ratioTxt=(Math.round(ratio*10)/10).toFixed(1);
  const grade=ratio>=7?["◎ とても見やすい","ok"]:ratio>=4.5?["○ 見やすい(AA基準)","ok"]:ratio>=3?["△ 大きな文字向き","ng"]:["✕ 読みにくい組み合わせ","ng"];
  el.innerHTML=`
  <div class="card">
    <div class="f-row"><div class="lbl">ベースの色をえらぶ</div>
      <div class="basepick">
        <input type="color" id="basePicker" value="${esc(state.base)}" aria-label="ベースの色">
        <input type="text" id="baseHex" value="${esc(state.base)}" maxlength="7" spellcheck="false" aria-label="カラーコード">
        <button id="btnRandom">🎲 ランダム</button>
      </div></div>
    <div class="f-row" style="margin-bottom:2px"><div class="lbl">配色のタイプ</div>
      <div class="seg" id="modeSeg">${MODES.map(m=>`<button data-v="${m.id}" class="${state.mode===m.id?"on":""}">${esc(m.label)}</button>`).join("")}</div>
      <p class="small" style="margin-top:5px">${esc(modeObj.desc)}</p></div>
  </div>
  <div class="card">
    <div class="pal" id="palRow">${cols.map((c,i)=>`
      <button class="sw" data-i="${i}" style="background:${c}; color:${textOn(c)}" title="タップでコピー">
        <span class="hx">${c}</span><span class="cp">タップでコピー</span>
      </button>`).join("")}</div>
    <div class="palbtns">
      <button id="btnCopyAll">HEXまとめてコピー</button>
      <button id="btnCopyCss">CSS変数でコピー</button>
      <button id="btnPng">🖼 画像で保存</button>
      <button id="btnFav">❤️ 保存</button>
      <button id="btnShare">🔗 共有リンク</button>
    </div>
  </div>
  <h2>この配色をつかうと…</h2>
  <div class="card">
    <div class="pv" style="background:${r.bg}">
      <div class="pv-head" style="background:${r.main}; color:${textOn(r.main)}">サイトのヘッダー</div>
      <div class="pv-body">
        <div class="pv-card" style="background:${r.sub}; color:${textOn(r.sub)}">
          <div class="pv-title" style="color:${r.ink}">見出しのテキスト</div>
          <div class="pv-text" style="color:${r.ink}">本文のテキストはこんな見え方になります。背景×文字の相性もここで確認できます。</div>
          <div class="pv-btnrow">
            <span class="pv-btn" style="background:${r.accent}; color:${textOn(r.accent)}">ボタン</span>
            <span class="pv-chip" style="background:${r.main}; color:${textOn(r.main)}">タグ</span>
          </div>
        </div>
      </div>
    </div>
    <div class="ctr-row">
      <span class="small">文字の見やすさ(背景 ${esc(r.bg)} × 文字 ${esc(r.ink)}):</span>
      <span class="badge ${grade[1]}">${grade[0]}</span>
      <span class="small">コントラスト比 ${ratioTxt} : 1</span>
    </div>
  </div>
  <p class="small">💡 使い方のコツ: いちばん薄い色を「背景」、いちばん濃い色を「文字」、鮮やかな色を「ボタンや見出しの差し色」にすると、だいたいうまくいきます。</p>`;

  $("#basePicker").oninput=e=>{ setBase(e.target.value); };
  $("#baseHex").onchange=e=>{
    let v=e.target.value.trim(); if(!v.startsWith("#")) v="#"+v;
    if(hexToRgb(v)) setBase(v.toUpperCase()); else { toast("「#」+6桁のカラーコードで入力してね"); e.target.value=state.base; }
  };
  $("#btnRandom").onclick=()=>{ setBase(randomBase()); };
  el.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{ state.mode=b.dataset.v; regen(); });
  el.querySelectorAll(".pal .sw").forEach(b=>b.onclick=()=>{ copyText(cols[+b.dataset.i], cols[+b.dataset.i]+" をコピーしました"); });
  $("#btnCopyAll").onclick=()=>copyText(cols.join(", "));
  $("#btnCopyCss").onclick=()=>{
    const roles=assignRoles(cols);
    const css=`:root{\n  --color-bg: ${roles.bg};\n  --color-sub: ${roles.sub};\n  --color-main: ${roles.main};\n  --color-accent: ${roles.accent};\n  --color-ink: ${roles.ink};\n}`;
    copyText(css, "CSS変数をコピーしました");
  };
  $("#btnPng").onclick=()=>downloadPng(cols);
  $("#btnFav").onclick=()=>{
    const favs=loadFavs();
    if(favs.some(f=>f.c.join()===cols.join())){ toast("この配色は保存済みです"); return; }
    favs.unshift({c:cols, t:Date.now()});
    if(favs.length>50) favs.pop();
    saveFavs(favs);
    toast("❤️ 保存しました");
  };
  $("#btnShare").onclick=()=>{
    const base=location.origin+location.pathname;
    copyText(base+"#c="+cols.map(c=>c.slice(1)).join(","), "共有リンクをコピーしました");
  };
}
function setBase(hex){ state.base=hex; regen(); }
function regen(){ state.colors=makePalette(state.base, state.mode); renderMake(); }

/* ---------- 画像で保存(Canvas→PNG) ---------- */
function downloadPng(cols){
  const W=1000, H=520, cw=W/cols.length;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d");
  cols.forEach((c,i)=>{
    ctx.fillStyle=c; ctx.fillRect(i*cw,0,cw+1,440);
    ctx.fillStyle=textOn(c);
    ctx.font="bold 26px Consolas, Menlo, monospace";
    ctx.textAlign="center";
    ctx.fillText(c, i*cw+cw/2, 410);
  });
  ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,440,W,80);
  ctx.fillStyle="#666666"; ctx.font="24px sans-serif"; ctx.textAlign="center";
  ctx.fillText("いろどりパレット", W/2, 490);
  const a=document.createElement("a");
  a.download="palette-"+cols.map(c=>c.slice(1)).join("-")+".png";
  a.href=cv.toDataURL("image/png");
  a.click();
  toast("画像を保存しました");
}

/* ---------- 見本帳タブ ---------- */
function renderBook(){
  const el=$("#tab-book");
  let html=`<div class="seg" style="margin-bottom:10px">
    <button data-v="mood" class="${state.bookSeg==="mood"?"on":""}">気分でえらぶ</button>
    <button data-v="wa" class="${state.bookSeg==="wa"?"on":""}">和の伝統色</button>
  </div>`;
  if(state.bookSeg==="mood"){
    html+=`<p class="small" style="margin-bottom:6px">気になるパレットは「つかう」で読み込んで、プレビューやコピーができます。</p>
    <div class="card">${PRESETS.map((p,i)=>`
      <div class="prow">
        <div class="strip">${p.c.map(c=>`<span style="background:${c}"></span>`).join("")}</div>
        <div class="pnm">${esc(p.n)}<span class="s">${esc(p.s)}</span></div>
        <button data-use="${i}" class="primary">つかう</button>
      </div>`).join("")}</div>`;
  }else{
    html+=`<p class="small" style="margin-bottom:6px">日本の伝統色48色。タップでカラーコードをコピー、「つかう」でこの色からパレットを作れます。</p>
    <div class="wagrid">${WACOLORS.map((w,i)=>`
      <div class="wa">
        <button class="copybit" data-wa="${i}" title="タップでコピー">
          <span class="dot" style="background:${w[2]}"></span>
          <span class="nm">${esc(w[0])}<span class="yomi">${esc(w[1])}</span><span class="hx">${w[2]}</span></span>
        </button>
        <button class="usebit" data-wause="${i}">つかう</button>
      </div>`).join("")}</div>
    <p class="small" style="margin-top:8px">※ 伝統色の色値は資料により少し差があります。広く使われている代表的な値を採用しています。</p>`;
  }
  el.innerHTML=html;
  el.querySelectorAll(".seg [data-v]").forEach(b=>b.onclick=()=>{ state.bookSeg=b.dataset.v; renderBook(); });
  el.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{
    const p=PRESETS[+b.dataset.use];
    state.colors=[...p.c]; state.base=p.c[2];
    tab="make"; render();
    $("#scroll-area").scrollTo({top:0, behavior:"smooth"});
    toast(`「${p.n}」を読み込みました`);
  });
  el.querySelectorAll("[data-wa]").forEach(b=>{
    const w=WACOLORS[+b.dataset.wa];
    b.onclick=()=>copyText(w[2], `${w[0]} ${w[2]} をコピーしました`);
  });
  el.querySelectorAll("[data-wause]").forEach(b=>{
    const w=WACOLORS[+b.dataset.wause];
    b.onclick=()=>{
      state.base=w[2]; state.colors=makePalette(w[2], state.mode);
      tab="make"; render();
      $("#scroll-area").scrollTo({top:0, behavior:"smooth"});
      toast(`${w[0]}からパレットを作りました`);
    };
  });
}

/* ---------- 保存タブ ---------- */
function renderFav(){
  const el=$("#tab-fav");
  const favs=loadFavs();
  if(favs.length===0){
    el.innerHTML=`<div class="card"><div class="emptybox">まだ保存した配色がありません。<br>「つくる」タブで気に入ったパレットを ❤️ 保存すると、ここに並びます。</div></div>`;
    return;
  }
  el.innerHTML=`<p class="small" style="margin-bottom:6px">保存した配色(この端末の中だけに保存されます)</p>
  <div class="card">${favs.map((f,i)=>`
    <div class="prow">
      <div class="strip">${f.c.map(c=>`<span style="background:${c}"></span>`).join("")}</div>
      <div class="pnm"><span class="s">${new Date(f.t).toLocaleDateString("ja-JP")}</span></div>
      <button data-load="${i}" class="primary">ひらく</button>
      <button data-del="${i}" class="ghost">削除</button>
    </div>`).join("")}</div>`;
  el.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{
    const f=favs[+b.dataset.load];
    state.colors=[...f.c]; state.base=f.c[2];
    tab="make"; render();
    $("#scroll-area").scrollTo({top:0, behavior:"smooth"});
  });
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    favs.splice(+b.dataset.del,1); saveFavs(favs); renderFav();
    toast("削除しました");
  });
}

/* ---------- 設定タブ ---------- */
function renderSettings(){
  const el=$("#tab-settings");
  el.innerHTML=`
  <div class="card">
    <h2 style="margin-top:0">このアプリについて</h2>
    <p class="small">色をひとつ選ぶだけで、色彩理論(色相環)に沿った調和する5色の配色パレットを自動生成するアプリです。ブログ・資料・ハンドメイド・イラストなどの色選びにどうぞ。</p>
    <p class="small" style="margin-top:6px">保存した配色はこの端末のブラウザの中だけに保存され、外部に送信されることはありません。一度開けばオフラインでも使えます。</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">まめ知識</h2>
    <p class="small">・配色は「<b>ベース(背景)70% : メイン25% : アクセント5%</b>」の割合にすると整って見えます(70:25:5の法則)。</p>
    <p class="small" style="margin-top:4px">・文字と背景の<b>コントラスト比は4.5:1以上</b>が読みやすさの国際基準(WCAG AA)。「つくる」タブのプレビューで自動判定しています。</p>
    <p class="small" style="margin-top:4px">・迷ったら「濃淡」か「類似色」を選ぶと失敗しません。</p>
  </div>
  <div class="card">
    <h2 style="margin-top:0">データの初期化</h2>
    <p class="small" style="margin-bottom:8px">保存した配色をすべて削除します。</p>
    <button id="btnReset" class="ghost">保存データを全部消す</button>
  </div>`;
  $("#btnReset").onclick=()=>{
    if(confirm("保存した配色をすべて削除します。よろしいですか?")){
      saveFavs([]); toast("初期化しました");
    }
  };
}

/* ---------- タブ・起動 ---------- */
let tab="make";
/* ?t=make|book|wa|fav|settings で開くタブを指定できる(ブログからの深掘りリンク用) */
{
  const tm=/[?&#]t=([a-z]+)/.exec(location.search+location.hash);
  if(tm){
    if(tm[1]==="wa"){ tab="book"; state.bookSeg="wa"; }
    else if(["make","book","fav","settings"].includes(tm[1])) tab=tm[1];
  }
}
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); });
});
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  ["make","book","fav","settings"].forEach(t=>{ $("#tab-"+t).hidden=(t!==tab); });
  if(tab==="make") renderMake();
  if(tab==="book") renderBook();
  if(tab==="fav") renderFav();
  if(tab==="settings") renderSettings();
}
render();
</script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
